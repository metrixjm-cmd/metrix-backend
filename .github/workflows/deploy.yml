name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  SERVICE: metrix-backend
  REGISTRY: us-central1-docker.pkg.dev
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.GCP_PROJECT_ID }}" || (echo "Missing secret: GCP_PROJECT_ID" && exit 1)
          test -n "${{ secrets.MONGO_URI }}" || (echo "Missing secret: MONGO_URI" && exit 1)
          test -n "${{ secrets.JWT_SECRET }}" || (echo "Missing secret: JWT_SECRET" && exit 1)
          test -n "${{ secrets.GCS_BUCKET_NAME }}" || (echo "Missing secret: GCS_BUCKET_NAME" && exit 1)
          if [ -z "${{ secrets.MP_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.MP_WEBHOOK_SECRET }}" ]; then
            echo "::warning::MP_ACCESS_TOKEN / MP_WEBHOOK_SECRET no están en GitHub Secrets."
            echo "::warning::El deploy no los toca (--update-env-vars). Configúralos en Cloud Run o agrégalos aquí."
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/metrix/backend:${{ github.sha }} \
          -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/metrix/backend:latest \
          .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/metrix/backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/metrix/backend:latest

      # --update-env-vars (no --set-env-vars): preserva variables manuales (MP_*) entre deploys.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/metrix/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=80 \
            --timeout=300 \
            --update-env-vars="^;;^SPRING_DATA_MONGODB_URI=${{ secrets.MONGO_URI }};;METRIX_SECURITY_JWT_SECRET_KEY=${{ secrets.JWT_SECRET }};;METRIX_ANALYTICS_URL=${{ secrets.ANALYTICS_URL }};;CORS_ALLOWED_ORIGINS=https://metrix-app.web.app,https://project-c0ecce2b-41ee-48b7-8b3.web.app;;SPRING_PROFILES_ACTIVE=docker;;GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }};;GCS_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }};;GCS_LOCAL_FALLBACK_ENABLED=false;;GCS_LOCAL_EVIDENCE_ENDPOINT_ENABLED=false;;METRIX_PUBLIC_API_URL=https://metrix-backend-249758130960.us-central1.run.app;;METRIX_FRONTEND_BASE_URL=https://metrix-app.web.app" \
            --quiet

      # `secrets` no está disponible en `if:` de steps; se evalúa dentro del shell.
      - name: Update Mercado Pago env (if secrets present)
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          if [ -z "$MP_ACCESS_TOKEN" ] || [ -z "$MP_WEBHOOK_SECRET" ]; then
            echo "MP_* no configurados en GitHub Secrets; se conservan los valores actuales de Cloud Run."
            exit 0
          fi
          gcloud run services update ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --update-env-vars="^;;^METRIX_PAYMENTS_PROVIDER=mercadopago;;MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN};;MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET}" \
            --quiet

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format="value(status.url)")
          echo "Deployed to: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/auth/login" -X POST -H "Content-Type: application/json" -d '{"numeroUsuario":"test","password":"test"}')
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "ERROR: Backend not responding"
            exit 1
          fi
          echo "Backend is up and responding"
