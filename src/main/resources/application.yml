server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: METRIX-API

  # MongoDB
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/metrix_db}
      # auto-index-creation se queda desactivado (el default de Spring Data 3.x).
      # Activarlo tumba el arranque: la base ya tiene índices creados a mano con
      # nombres distintos a los que infieren las anotaciones — p. ej. 'store_id_idx'
      # en users contra el 'store_id' que genera @Indexed — y Mongo rechaza el
      # duplicado con IndexOptionsConflict. Los índices que hagan falta se crean
      # explícitamente; ver MongoIndexInitializer.

  # Archivos
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # Desactivar auto-config de Redis (no lo usamos en modo single-instance)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Configuración personalizada de METRIX
metrix:
  google-cloud:
    bucket-name: ${GCS_BUCKET_NAME:metrix-app-storage-prod}
    project-id: ${GCS_PROJECT_ID:}
    credentials-path: ${GCS_CREDENTIALS_PATH:}
    local-fallback-enabled: ${GCS_LOCAL_FALLBACK_ENABLED:true}
    local-evidence-endpoint-enabled: ${GCS_LOCAL_EVIDENCE_ENDPOINT_ENABLED:false}
    signed-urls-enabled: ${GCS_SIGNED_URLS_ENABLED:true}
    signed-url-duration-minutes: ${GCS_SIGNED_URL_DURATION_MINUTES:60}

  security:
    jwt:
      # Sin valor por defecto a propósito: el que había estaba commiteado y servía
      # para firmar tokens con cualquier rol en cualquier despliegue que no
      # exportara la variable. La aplicación no arranca sin ella — es deliberado.
      # Para desarrollo local, exportar METRIX_SECURITY_JWT_SECRET_KEY (base64, >=256 bits).
      secret-key: ${METRIX_SECURITY_JWT_SECRET_KEY}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  analytics:
    url: ${METRIX_ANALYTICS_URL:http://localhost:8001/api/v1/analytics}
    # TODO(seguridad): este default también está commiteado, pero quitarlo ahora
    # tumbaría el arranque en producción — METRIX_API_KEY no se define ni en
    # deploy.yml ni en application-docker.yml. Requiere añadir el secreto y la
    # variable al workflow antes de dejarlo sin valor por defecto.
    api-key: ${METRIX_API_KEY:dev-internal-key}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

# Logging
logging:
  level:
    root: INFO
    org.springframework.data.mongodb: ${LOG_LEVEL_MONGO:WARN}
    com.metrix.api: ${LOG_LEVEL_APP:INFO}
    com.metrix.api.security: ${LOG_LEVEL_SECURITY:WARN}

